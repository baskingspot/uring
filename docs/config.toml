# The uring guide, served at baskingspot.dev/uring/. The theme and the site
# build come from baskingspot-docs; the router in baskingspot/site serves
# /uring/...
base_url = "https://baskingspot.dev/uring"
theme = "baskingspot"
title = "uring"
description = "An io_uring completion loop for Zig: one ring, one tick, and a user_data type you define."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/uring"
api = true
third_party = false
